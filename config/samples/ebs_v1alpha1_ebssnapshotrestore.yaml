apiVersion: ebs.aws.edenlab.io/v1alpha1
kind: EBSSnapshotRestore
metadata:
  labels:
    app.kubernetes.io/name: ebs-snapshot-restore
    app.kubernetes.io/managed-by: kustomize
  name: ebs-snapshot-restore
spec:
  restorePlans:
    db-ebs-csi-snapshot:
      clusters:
        - name: db-cluster-0
          type: statefulset
          replicas: 1
          namespace: db
          pvcStorageClass: gp3-restore
          parallelPodManagement: true
          skipWaitScaleUp: true
          claimSelector:
            matchLabels:
              release: db

      hooks:
        preHook:
          events:
            - pre-restore
          command: [ "bash", "-c" ]
          args:
            - |
              set  -e
              echo "Hello"
          image: "ubuntu"
          extraSecrets:
            - name: db-cluster-secret
        postHook:
          events:
            - post-restore
          command: [ "bash", "-c" ]
          args:
            - |
              set  -e
              env | grep "DB_CREDENTIALS"
          image: "ubuntu"
          mutable: true
          extraSecrets:
            - name: db-cluster-secret
              prefix: DB_CREDENTIALS

      operators:
        - name: operator
          replicas: 1
          namespace: db
          type: deployment

      snapshotRestoreTime: "202601010000"

    object-storage-ebs-csi-snapshot:
      clusters:
        - name: object-storage
          type: statefulset
          replicas: 4
          namespace: object-storage
          skipWaitScaleDown: true
          skipRestoringPVCs:
            - export-1-object-storage-3
          claimSelector:
            matchLabels:
              release: object-storage

      snapshotRestoreTime: "202601010000"
